<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">The Lekh Romanized Nepali typing flow</title>
  <desc id="description">Type namaste in Roman letters, review the local suggestion नमस्ते, then explicitly commit it into the app where you are writing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#e8f5f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6b5b"/>
      <stop offset="1" stop-color="#15947d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#123b33" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="478" rx="28" fill="url(#background)" stroke="#c9ded8" stroke-width="2"/>
  <circle cx="1100" cy="36" r="160" fill="#0d6b5b" opacity=".045"/>
  <circle cx="84" cy="452" r="124" fill="#15947d" opacity=".055"/>

  <text x="60" y="58" fill="#0d6b5b" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="750" letter-spacing="2.8">THE LEKH FLOW</text>
  <text x="60" y="88" fill="#273833" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Romanized input → local candidates → explicit commit</text>

  <g filter="url(#shadow)">
    <rect x="60" y="126" width="298" height="246" rx="22" fill="#ffffff"/>
    <rect x="451" y="126" width="298" height="246" rx="22" fill="#ffffff"/>
    <rect x="842" y="126" width="298" height="246" rx="22" fill="#ffffff"/>
  </g>

  <rect x="60" y="126" width="298" height="7" rx="3.5" fill="#d7e9e4"/>
  <rect x="451" y="126" width="298" height="7" rx="3.5" fill="#0d6b5b"/>
  <rect x="842" y="126" width="298" height="7" rx="3.5" fill="#d7e9e4"/>

  <text x="86" y="172" fill="#6b7b76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="750" letter-spacing="1.7">1 · TYPE NATURALLY</text>
  <rect x="86" y="199" width="246" height="76" rx="14" fill="#f5f7f5" stroke="#d9e3df"/>
  <text x="110" y="249" fill="#171f1c" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="620">namaste</text>
  <rect x="282" y="220" width="2" height="35" rx="1" fill="#0d6b5b"/>
  <text x="86" y="309" fill="#273833" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="650">Stay inside the app.</text>
  <text x="86" y="337" fill="#6b7b76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">No tab switching. No copy-paste.</text>

  <text x="477" y="172" fill="#6b7b76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="750" letter-spacing="1.7">2 · REVIEW THE SUGGESTION</text>
  <rect x="477" y="199" width="246" height="76" rx="14" fill="url(#accent)"/>
  <circle cx="506" cy="237" r="15" fill="#ffffff" opacity=".18"/>
  <text x="506" y="242" fill="#ffffff" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="750">1</text>
  <text x="538" y="249" fill="#ffffff" font-family="Noto Sans Devanagari, Kohinoor Devanagari, Mangal, sans-serif" font-size="38" font-weight="700">नमस्ते</text>
  <text x="477" y="309" fill="#273833" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="650">Lekh suggests. You decide.</text>
  <text x="477" y="337" fill="#6b7b76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Nothing is committed automatically.</text>

  <text x="868" y="172" fill="#6b7b76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="750" letter-spacing="1.7">3 · KEEP WRITING</text>
  <rect x="868" y="199" width="246" height="76" rx="14" fill="#f5f7f5" stroke="#d9e3df"/>
  <text x="892" y="248" fill="#171f1c" font-family="Noto Sans Devanagari, Kohinoor Devanagari, Mangal, sans-serif" font-size="32" font-weight="650">नमस्ते, साथी।</text>
  <text x="868" y="309" fill="#273833" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="650">Your thought stays intact.</text>
  <text x="868" y="337" fill="#6b7b76" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">The text lands in your app.</text>

  <g aria-hidden="true">
    <circle cx="404" cy="249" r="24" fill="#ffffff" stroke="#c9ded8" stroke-width="2"/>
    <path d="M396 249h16m-6-6 6 6-6 6" fill="none" stroke="#0d6b5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="795" cy="249" r="24" fill="#ffffff" stroke="#c9ded8" stroke-width="2"/>
    <path d="M787 249h16m-6-6 6 6-6 6" fill="none" stroke="#0d6b5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">
    <rect x="343" y="414" width="145" height="36" rx="18" fill="#ffffff" stroke="#c9ded8"/>
    <circle cx="367" cy="432" r="5" fill="#0d6b5b"/>
    <text x="382" y="437" fill="#273833">ON-DEVICE</text>

    <rect x="510" y="414" width="180" height="36" rx="18" fill="#ffffff" stroke="#c9ded8"/>
    <circle cx="534" cy="432" r="5" fill="#0d6b5b"/>
    <text x="549" y="437" fill="#273833">EXPLICIT CHOICE</text>

    <rect x="712" y="414" width="145" height="36" rx="18" fill="#ffffff" stroke="#c9ded8"/>
    <circle cx="736" cy="432" r="5" fill="#0d6b5b"/>
    <text x="751" y="437" fill="#273833">FAIL-CLOSED</text>
  </g>
</svg>
