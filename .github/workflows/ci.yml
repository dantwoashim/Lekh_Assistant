name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Validate workflow security policy
        run: |
          node .github/scripts/validate-workflows.mjs
          node --test .github/scripts/*.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full verification gate
        run: npm run verify

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

  quality-report:
    name: Quality report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fixture quality report
        run: npm run report:quality

  native-macos:
    name: Native macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        if: matrix.runner == 'macos-15'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify neural trainer and Core ML export contract
        if: matrix.runner == 'macos-15'
        run: npm run neural:open-vocab:test

      - name: Verify native source contracts
        run: npm run check:ipc-schema && npm run test:native-scaffold

      - name: Build Swift input method
        run: npm run build:macos

      - name: Inspect Core ML compute placement
        shell: bash
        run: |
          swift run --package-path native/macos-imk/skeleton \
            LekhNeuralComputePlanProbe \
            models/macos/LekhNeuralTransliterator.mlmodelc \
            > "$RUNNER_TEMP/neural-compute-plan.json"
          node scripts/check-neural-compute-plan-evidence.mjs \
            --evidence "$RUNNER_TEMP/neural-compute-plan.json" \
            --report "$RUNNER_TEMP/neural-compute-plan-validation.json"

      - name: Exercise native typing behavior
        run: swift run --package-path native/macos-imk/skeleton LekhInputMethodBehaviorProbe

      - name: Compare TypeScript and Swift behavior contracts
        shell: bash
        run: |
          corpus="$GITHUB_WORKSPACE/contracts/keyboard-behavior/v1/lekh-keyboard-behavior.v1.jsonl"
          ./node_modules/.bin/vite-node \
            scripts/run-keyboard-behavior-contract.ts \
            "$corpus" > "$RUNNER_TEMP/typescript-behavior.jsonl"
          swift run --package-path native/macos-imk/skeleton \
            LekhBehaviorContractRunner \
            "$corpus" > "$RUNNER_TEMP/swift-behavior.jsonl"
          cmp "$RUNNER_TEMP/typescript-behavior.jsonl" "$RUNNER_TEMP/swift-behavior.jsonl"
          shasum -a 256 "$RUNNER_TEMP/typescript-behavior.jsonl"

  native-windows:
    name: Native Windows (${{ matrix.runner }} / ${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            run_tests: true
          - runner: windows-2025
            architecture: x64
            run_tests: true
          - runner: windows-2025
            architecture: ARM64
            run_tests: false

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native source contracts
        run: npm run check:ipc-schema && npm run test:native-scaffold

      - name: Build and test Windows TSF service
        shell: pwsh
        run: |
          if ("${{ matrix.run_tests }}" -eq "true") {
            & ".\native\windows-tsf\skeleton\build.ps1" -Architecture "${{ matrix.architecture }}"
          } else {
            & ".\native\windows-tsf\skeleton\build.ps1" -Architecture "${{ matrix.architecture }}" -SkipTests
          }

      - name: Verify Windows packaging contract
        if: matrix.architecture == 'x64'
        run: npm run check:windows-installer-contract
