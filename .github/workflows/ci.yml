name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEKH_EXPERIMENTAL_NEURAL_TYPING: "0"

jobs:
  native-macos:
    name: macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: ARM64
          - runner: macos-15-intel
            architecture: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic v1 unit tests
        run: npm run test:v1

      - name: Verify scalar neural contracts
        run: |
          npx vitest run \
            scripts/check-neural-production-readiness.test.mjs \
            scripts/run-neural-training-detached.test.mjs \
            scripts/lib/devanagari-word-sequence.test.mjs \
            scripts/lib/neural-training-contract.test.mjs \
            --pool=forks \
            --maxWorkers=1

      - name: Build application
        run: npm run build

      - name: Verify IPC contract
        run: npm run check:ipc-schema

      - name: Verify unsigned macOS first-run walkthrough
        run: node scripts/check-macos-unsigned-install-ux.mjs --check-receipt

      - name: Build Swift input method
        run: npm run build:macos

      - name: Run Swift input method unit probe
        run: >-
          swift run --configuration release
          --package-path native/macos-imk/skeleton
          LekhInputMethodUnitProbe

      - name: Compare TypeScript and Swift behavior contracts
        shell: bash
        run: |
          corpus="$GITHUB_WORKSPACE/contracts/keyboard-behavior/v1/lekh-keyboard-behavior.v1.jsonl"
          ./node_modules/.bin/vite-node \
            scripts/run-keyboard-behavior-contract.ts \
            "$corpus" > "$RUNNER_TEMP/typescript-behavior.jsonl"
          swift run --configuration release --package-path native/macos-imk/skeleton \
            LekhBehaviorContractRunner \
            "$corpus" > "$RUNNER_TEMP/swift-behavior.jsonl"
          cmp "$RUNNER_TEMP/typescript-behavior.jsonl" "$RUNNER_TEMP/swift-behavior.jsonl"
          shasum -a 256 "$RUNNER_TEMP/typescript-behavior.jsonl"

      - name: Prepare per-run unsigned-package manifest key
        if: matrix.architecture == 'ARM64'
        shell: bash
        run: |
          if ! command -v minisign >/dev/null 2>&1; then
            brew install minisign
          fi
          key_directory="$RUNNER_TEMP/lekh-release-manifest-key"
          mkdir -p "$key_directory"
          minisign -G -W \
            -p "$key_directory/lekh-release-manifest-minisign.pub" \
            -s "$key_directory/lekh-release-manifest-minisign.sec"
          echo "LEKH_RELEASE_MANIFEST_MINISIGN_PUBLIC_KEY=$key_directory/lekh-release-manifest-minisign.pub" >> "$GITHUB_ENV"
          echo "LEKH_RELEASE_MANIFEST_MINISIGN_SECRET_KEY=$key_directory/lekh-release-manifest-minisign.sec" >> "$GITHUB_ENV"

      - name: Build unsigned universal macOS release artifact
        if: matrix.architecture == 'ARM64'
        env:
          LEKH_PACKAGE_NEURAL_MODEL: "0"
          LEKH_EXPERIMENTAL_NEURAL_TYPING: "0"
          LEKH_MACOS_PACKAGE_WALKTHROUGH_ONLY: "1"
        run: npm run v1:package:macos

      - name: Upload universal macOS release artifact
        if: matrix.architecture == 'ARM64'
        uses: actions/upload-artifact@v7
        with:
          name: lekh-v1-macos-universal
          path: release/native/macos/Lekh-Keyboard-Test-Installer.zip
          if-no-files-found: error
          compression-level: 0

  native-windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
            package_architecture: x64
          - runner: windows-11-arm
            architecture: ARM64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting and types on Windows
        run: npm run format:check && npm run typecheck

      - name: Build and test Windows TSF service
        shell: pwsh
        run: |
          & ".\native\windows-tsf\skeleton\build.ps1" `
            -Architecture "${{ matrix.architecture }}"

      - name: Run deterministic v1 unit tests
        run: npm run test:v1

      - name: Build application
        run: npm run build

      - name: Verify IPC contract
        run: npm run check:ipc-schema

      - name: Verify portable typing policy guards on Windows
        run: npm run check:experimental-passive-commit && npm run check:composition-work-bound

      - name: Verify Windows packaging contract
        if: matrix.architecture == 'x64'
        run: npm run check:windows-installer-contract

      - name: Build unsigned Windows installer
        if: matrix.architecture == 'x64'
        run: node scripts/package-windows-companion.mjs --unsigned --architecture "${{ matrix.architecture }}"

      - name: Verify silent Windows install lifecycle
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: .\scripts\test-windows-installer.ps1

      - name: Upload Windows release artifact
        if: matrix.architecture == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: lekh-v1-windows-${{ matrix.package_architecture }}
          path: release/Lekh-Keyboard-Companion-1.0.0-Setup-${{ matrix.package_architecture }}.exe
          if-no-files-found: error
          compression-level: 0

  release-candidate:
    name: v1.0.0 release bundle
    needs:
      - native-macos
      - native-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Download installers from this CI run
        uses: actions/download-artifact@v8
        with:
          pattern: lekh-v1-*
          path: release-candidate
          merge-multiple: true

      - name: Generate checksums and rendered release notes
        run: >-
          node scripts/render-release-checksums.mjs
          --notes RELEASE_NOTES_v1.0.md
          --artifacts release-candidate
          --output release-candidate/RELEASE_NOTES_v1.0.md
          --checksums release-candidate/SHA256SUMS.txt

      - name: Upload self-consistent v1.0.0 release bundle
        uses: actions/upload-artifact@v7
        with:
          name: lekh-assistant-v1.0.0-release-candidate
          path: release-candidate
          if-no-files-found: error
          compression-level: 0
